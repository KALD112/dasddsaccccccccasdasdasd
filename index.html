        .overlay {

            left: 0;

            z-index: -1;

            z-index: 10;

        /* النص العلوي */

            position: absolute;
            top: 15%;
            right: 10%;
            font-size: 2.5em;
            color: #ff3333;
            text-shadow: 0 0 20px #ff3333, 0 0 40px #ff3333;
            font-weight: bold;
            animation: glow-red 2s ease-in-out infinite alternate;
        }

        @keyframes glow-red {
            from {
                text-shadow: 0 0 20px #ff3333, 0 0 40px #ff3333;
            }

            to {
                text-shadow: 0 0 30px #ff6666, 0 0 60px #ff6666;
            }
        }

            font-size: 2em;
            color: #ff3333;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            20%,
            50%,
            80%,
            100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(-10px);
            }

            60% {
                transform: translateY(-5px);
            }
        }

        /* شريط التحميل */
        .loading-bar-container {
            width: 400px;
            height: 20px;
            background: #222;
            border-radius: 25px;
            overflow: hidden;
            margin: 30px 0;
            border: 2px solid #555;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
        }

        .loading-bar {
            height: 100%;
            background: linear-gradient(90deg, #00ff00, #66ff66, #00ff00);
            width: 0%;
            border-radius: 25px;
            animation: loading 3s ease-in-out forwards;
            /* تم تسريع التحميل */
            box-shadow: 0 0 15px #aaffaa;
        }

        @keyframes loading {
            0% {
                width: 0%;
            }

            100% {

            }

        /* العنوان الرئيسي */

            color: #fff;
            margin: 20px 0;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
            letter-spacing: 8px;
            animation: pulse-white 3s ease-in-out infinite;
        }

        @keyframes pulse-white {

            0%,
            100% {
                text-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
                transform: scale(1);
            }

            50% {
                text-shadow: 0 0 50px rgba(255, 255, 255, 1);
                transform: scale(1.02);
            }
        }

        /* العنوان الفرعي */
        .subtitle {

            color: #ccc;

            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            letter-spacing: 3px;

            font-size: 1.6em;
            color: #ffd700;
            margin-top: 40px;
            text-shadow:
                0 0 10px #ffd700,
                0 0 20px #ffd700,
                0 0 30px #ffec3d,
                0 0 40px #ffec3d,
                0 0 50px #ffec3d,

            font-family: 'Courier New', monospace;
            animation: glow-gold 3s ease-in-out infinite alternate;
            text-decoration: none;
            transition: all 0.3s ease;

        }

        .discord-link:hover {
            color: #fff59d;

                0 0 25px #fff59d,
                0 0 35px #fff59d,

                    0 0 40px #fffacd,
                    0 0 50px #fffacd,
                    0 0 60px #fffacd,

            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        /* تأثيرات الجسيمات */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: float 6s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(-10px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Fade Out شاشة التحميل */
        .fade-out {
            animation: fadeOut 1.0s ease forwards;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        /* Fade In للمحتوى الرئيسي */

            animation: fadeIn 1.5s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

            font-family: 'Courier New', monospace;
            z-index: 1000;

            align-items: center;

        .status-dot {

            height: 10px;
            background-color: #00ff00;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff00;
            animation: blink 1s infinite alternate;

        @keyframes blink {
            from {

            }

            to {
                opacity: 0.3;
            }

        /* تأثير Glitch */
        .glitch {
            position: relative;
            color: white;
            font-size: 3em;
            letter-spacing: 0.1em;
            animation: glitch-skew 1s infinite linear alternate-reverse;
        }

        .glitch::before {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            left: 2px;
            text-shadow: -2px 0 #ff00c1;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }

        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            left: -2px;
            text-shadow: -2px 0 #00fff9;

            for (let i = 0; i < 50; i++) {

                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';

                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
                particles.appendChild(particle);
                setTimeout(() => particle.remove(), 6000);
            }
        }
        // تجديد الجسيمات كل 6 ثواني
        setInterval(createParticles, 6000);
        createParticles();

        // تشغيل الصوت - دعم FiveM
        // للاستخدام في FiveM: SendNUIMessage({action = 'play'})
        // لإيقاف: SendNUIMessage({action = 'stop'})
        // للتحكم بالصوت: SendNUIMessage({action = 'setVolume', volume = 0.5})
        const a = document.getElementById('background-music');
        const play = () => {
            if (a) {
                a.muted = false;
                a.play().catch(() => { });
            }
        };

        // استماع لرسائل FiveM
        window.addEventListener('message', (e) => {
            if (!a) return;
            if (e.data.action === 'playMusic') play();
            if (e.data.action === 'stopMusic') { a.pause(); a.currentTime = 0; }
            if (e.data.action === 'setVolume') a.volume = e.data.volume || 1;
        });

        // تشغيل تلقائي عند تحميل الصفحة (لـ FiveM)
        if (a) {
            a.addEventListener('canplay', () => {
                setTimeout(() => play(), 500);
            });
        }
